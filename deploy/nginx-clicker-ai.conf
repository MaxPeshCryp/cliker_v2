server {
    listen 80;
    listen [::]:80;
    server_name max-click.iteacher-ai.org;

    # Keep HTTP validation available for automatic certificate renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://max-click.iteacher-ai.org$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name max-click.iteacher-ai.org;

    ssl_certificate /etc/letsencrypt/live/max-click.iteacher-ai.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/max-click.iteacher-ai.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
