server {
    listen 80;
    listen [::]:80;
    server_name max_click_pesh.iteacher-alex.org;

    # Required for the initial Let's Encrypt validation and HTTP-to-HTTPS redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name max_click_pesh.iteacher-alex.org;

    ssl_certificate /etc/letsencrypt/live/max_click_pesh.iteacher-alex.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/max_click_pesh.iteacher-alex.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;

    location / {
        proxy_pass http://unix:/run/clicker/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
