# Temporary HTTP-only configuration used before the new certificate exists.
server {
    listen 80;
    listen [::]:80;
    server_name max-click.iteacher-ai.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
